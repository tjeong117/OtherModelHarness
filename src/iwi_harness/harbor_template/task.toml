schema_version = "1.4"

[task]
name = "iwi-harness/tiny-alias"
version = "0.1.0"
description = "Teach a CPU transformer a color alias and retain its existing behavior."

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 8192
build_timeout_sec = 1200
network_mode = "no-network"

[agent]
timeout_sec = 600

[verifier]
environment_mode = "separate"
timeout_sec = 120

[verifier.environment]
cpus = 2
memory_mb = 4096
storage_mb = 8192
build_timeout_sec = 1200
network_mode = "no-network"
